#borrow模块
server:
  port: 8103

spring:
  application:
    name: shelf-borrow
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:localhost:8848}
      discovery:
      # 继承上面的 server-addr
      config:
        import-check:
          enabled: false
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/shelf?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:your_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      database: 0
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: 5672
    username: ${RABBIT_USER:shareshelf}
    password: ${RABBIT_PASSWORD:your_password}
    virtual-host: /
    listener:
      simple:
        acknowledge-mode: manual
#  amqp:
#    deserialization:
#          trust:
#            all: true

sa-token:
  token-name: Authorization
  timeout: 86400
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: false


mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl


feign:
  sentinel:
    enabled: true